[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dupscope"
version = "0.1.0"
description = "Find duplicated and cloned image regions in scientific figures, for human review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pearl Franz" }]
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24", "typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
bench = ["scikit-image>=0.22", "matplotlib>=3.7", "scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.5", "scikit-image>=0.22", "matplotlib>=3.7"]

[project.scripts]
dupscope = "dupscope.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dupscope"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/dupscope/report.py" = ["E501"]  # inline CSS
"docs/build.py" = ["E501"]  # HTML template

[tool.pytest.ini_options]
testpaths = ["tests"]
