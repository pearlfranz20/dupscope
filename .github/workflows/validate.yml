name: Retraction check

# Runs dupscope on neuroscience papers retracted for image problems (public record)
# and on matched control papers (reported as counts only), then commits the
# results to results/retractions/. Started by hand from the Actions tab.
# Set a repository variable CONTACT_EMAIL to give NCBI and Crossref a real contact.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Retracted papers to check (0 = all)"
        default: "0"
      controls:
        description: "Control papers per retracted paper"
        default: "1"

permissions:
  contents: write

concurrency:
  group: retraction-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LIMIT: ${{ inputs.limit }}
      CONTROLS: ${{ inputs.controls }}
      CONTACT: ${{ vars.CONTACT_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      # downloads and per-paper results from earlier runs, so a rerun resumes; Actions
      # caches are private to the repository's workflows
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dupscope-cache
          key: dupscope-cache-${{ github.run_id }}
          restore-keys: dupscope-cache-
      - name: Retraction Watch data (Crossref)
        run: |
          git clone --depth 1 https://gitlab.com/crossref/retraction-watch-data rw || true
          ls -la rw || true
      - name: Check papers
        # leaves time for the cache and results to be saved if this runs long; a rerun
        # resumes from the cache
        timeout-minutes: 320
        run: |
          CSV=$(ls rw/*.csv 2>/dev/null | head -1)
          if [ -n "$CSV" ] && head -c 100 "$CSV" | grep -q "git-lfs"; then CSV=""; fi
          dupscope validate-retractions \
            --mailto "$CONTACT" \
            ${CSV:+--csv-path "$CSV"} \
            --limit "$LIMIT" --controls "$CONTROLS" \
            --workers 4 --cache-dir "$RUNNER_TEMP/dupscope-cache" \
            --out results/retractions
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/dupscope-cache
          key: dupscope-cache-${{ github.run_id }}
      - name: Commit results
        if: always()
        run: |
          [ -d results/retractions ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/retractions
          git commit -m "Retraction check results" || exit 0
          git pull --rebase
          git push
